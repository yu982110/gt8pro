# devices/lafa/device.conf: what this device repository is (docs/porting/repositories.md has every word).
#
# realme GT8 Pro 阿斯顿马丁 F1 限量版, model RMX5200, project RE6030L1, platform canoe, SoC SM8850.
# Measured on the phone, 2026-10-31: see phone/FINDINGS.md in the port kit. The recovery device tree that
# gives this board the name lafa describes the RMX6699; whether the two are one board is to be confirmed
# from the kernel device tree, and nothing here depends on the answer yet.
#
# Every status is missing because nothing has been seen running on this phone yet.

device lafa
	title       realme GT8 Pro (Aston Martin F1, RMX5200)
	vendor      realme
	soc         sm8850
	defconfig   lafa_defconfig
	firmware    pull-firmware.sh
	maintainer  ty <you@example.com>
	status      display     missing   BOE AE084, DSC, cmd mode, 3136x1440 native (FHD+ 1080x2352 in use); no platform yet
	status      touch       missing   Synaptics S3910 (TCM2), measured from the phone cmdline and input devices
	status      buttons     missing   pmic_pwrkey / gpio-keys / pmic_resin, seen in /proc/bus/input/devices
	status      cpu         missing   SM8850 OPP tables and CPU topology from the phone own device tree (no root: from the vendor kernel source)
	status      gpu         missing   Adreno 840; needs fw-gpu/ and CONFIG_HAKIOS_ADRENO
	status      storage     missing   UFS (variant SM8 UFS), 4 KiB pages, boot_a 96 MiB
	status      audio       missing   the ADSP
	status      battery     missing   the level comes through the ADSP
	status      haptic      missing   qcom-hv-haptics seen on the phone
	status      camera      missing   not started
	status      torch       missing   not started
	status      wifi        missing   needs fw-wifi/ (and fw-wifi/mac, fw-wifi/network)
	status      bluetooth   missing   not started
	status      cellular    missing   not started
	status      network     missing   not started
	status      thermal     missing   the SoC sensors, from the device tree
	status      usb         missing   ABL starts an EFI image from boot.img: the loader runs, no lafa platform yet
	status      sensors     missing   not started
