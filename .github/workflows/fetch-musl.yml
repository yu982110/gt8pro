name: fetch-musl

# 只为取一个文件：Alpine 的 musl 动态加载器（aarch64），给手机上的静态 Python 用。
on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: download the alpine musl package
        run: |
          set -eux
          BASE=https://dl-cdn.alpinelinux.org/alpine
          rm -f musl.apk
          for v in v3.21 v3.20 v3.19 v3.18 edge; do
            IDX=$(curl -fsSL "$BASE/$v/main/aarch64/" || true)
            NAME=$(printf '%s' "$IDX" | grep -o 'musl-[0-9.]*-r[0-9]*\.apk' | head -1)
            echo "$v -> ${NAME:-none}"
            if [ -n "$NAME" ] && curl -fsSL -o musl.apk "$BASE/$v/main/aarch64/$NAME"; then
              echo "got $NAME from $v"
              break
            fi
          done
          test -s musl.apk
          ls -la musl.apk
          mkdir -p out
          tar xzf musl.apk -C out 2>/dev/null || tar xJf musl.apk -C out
          find out -name 'ld-musl*' -o -name 'libc.musl*' | head

      - name: collect what python needs
        run: |
          set -eux
          mkdir -p dist
          find out -name 'ld-musl-aarch64.so.1' -exec cp {} dist/ \;
          find out -name 'libc.so' -path '*lib*' -exec cp {} dist/libc.so \;
          ls -la dist
          sha256sum dist/* || true

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: musl-aarch64
          path: dist/
          if-no-files-found: error
