name: build lafa root image

on:
  workflow_dispatch:
  push:
    paths:
      - "ci/mkrootimg.sh"
      - ".github/workflows/build-rootimg.yml"

jobs:
  rootimg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq hfsprogs clang lld

      - name: build a tiny /sbin/launchd (Mach-O arm64, raw syscalls)
        run: |
          set -euo pipefail
          cat > /tmp/lafd.c <<'EOF'
          /* hakios lafa: a stand-in launchd.  Writes one line to stderr (fd 2) with a
           * raw Darwin syscall and never returns, so XNU's exec path is exercised. */
          static long sys_write(int fd, const void *buf, unsigned long n)
          {
          	register long x16 __asm__("x16") = 4;      /* SYS_write */
          	register long x0 __asm__("x0") = fd;
          	register long x1 __asm__("x1") = (long)buf;
          	register long x2 __asm__("x2") = (long)n;
          	__asm__ volatile("svc #0x80" : "+r"(x0) : "r"(x16), "r"(x1), "r"(x2) : "memory");
          	return x0;
          }
          void start(void)
          {
          	static const char msg[] = "\nlafd: hello from userspace on lafa\n";
          	sys_write(2, msg, sizeof(msg) - 1);
          	for (;;) {
          		__asm__ volatile("wfi");
          	}
          }
          EOF
          clang --target=arm64-apple-macos11 -nostdlib -static -fuse-ld=lld \
                -Wl,-e,_start -Wl,-platform_version,macos,11.0,11.0 \
                -O2 -o /tmp/dyld-stub /tmp/lafd.c

          # XNU's load_dylinker wants filetype MH_DYLINKER (7); lld made MH_EXECUTE (2).
          # The field is a little-endian uint32 at Mach-O offset 12.
          python3 - <<'PY'
          import struct
          p = "/tmp/dyld-stub"
          d = bytearray(open(p, "rb").read())
          magic, = struct.unpack_from("<I", d, 0)
          assert magic == 0xfeedfacf, hex(magic)
          ft, = struct.unpack_from("<I", d, 12)
          print("filetype before:", ft)
          struct.pack_into("<I", d, 12, 7)      # MH_DYLINKER
          open(p, "wb").write(d)
          print("filetype after:", struct.unpack_from("<I", d, 12)[0])
          PY

          # /sbin/launchd: link against a dummy dylib so lld emits LC_LOAD_DYLINKER=/usr/lib/dyld.
          # The kernel then takes its normal exec path and jumps into our /usr/lib/dyld stub.
          cat > /tmp/empty.c <<'EOF'
          int dummy_symbol(void) { return 0; }
          EOF
          clang --target=arm64-apple-macos11 -nostdlib -fuse-ld=lld -dynamiclib \
                -Wl,-platform_version,macos,11.0,11.0 \
                -o /tmp/libSystem.dylib /tmp/empty.c

          cat > /tmp/launchd.c <<'EOF'
          extern int dummy_symbol(void);
          void start(void) { dummy_symbol(); for (;;) { __asm__ volatile("wfi"); } }
          EOF
          clang --target=arm64-apple-macos11 -nostdlib -fuse-ld=lld \
                -L/tmp -lSystem -Wl,-undefined,dynamic_lookup -Wl,-e,_start \
                -Wl,-platform_version,macos,11.0,11.0 \
                -O2 -o /tmp/launchd /tmp/launchd.c
          file /tmp/dyld-stub /tmp/launchd /tmp/libSystem.dylib
          ls -la /tmp/launchd

      - name: make the HFS root image with /sbin/launchd
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq hfsutils
          dd if=/dev/zero of=root-hfs.img bs=1M count=24 status=none
          hformat -l lafa root-hfs.img
          hmount root-hfs.img
          hmkdir :sbin
          hmkdir :dev
          hmkdir :etc
          hmkdir :usr
          hmkdir :usr:libexec
          hmkdir :usr:lib
          hcopy /tmp/launchd :sbin:launchd
          hcopy /tmp/dyld-stub :usr:lib:dyld
          hls -l :sbin
          humount
          ls -la root-hfs.img

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: lafa-rootimg
          path: root-hfs.img
