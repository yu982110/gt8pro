name: build pandora kernel (SM8850 reference, macOS)

# The reference kernel for this SoC family: Data A Live (ShueiTsuki) runs iPhone X iOS 16.7.16
# on the Xiaomi 17 Pro (SM8850, Adreno 840) with the patches in its xnu/patches directory,
# built through blacktop/darwin-xnu-build.  This workflow does the same build in our repository
# so the lafa board work (loader, device tree, drivers) can be tried against a kernel that is
# known to reach the lock screen on this SoC.
#
# Public repository, so GitHub-hosted macOS runners are free for it.

on:
  workflow_dispatch:
    inputs:
      machine_config:
        description: xnu MACHINE_CONFIG (PANDORA = the reference board, 4 KiB pages)
        default: PANDORA
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"

concurrency:
  group: xnu-pandora-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  REF_REPO: https://github.com/ShueiTsuki/data-a-live
  REF_REF: main
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'PANDORA' }}

jobs:
  build:
    # macos-14 still ships Xcode 15.x: its iig matches the xnu-8796 IORPC ABI
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the reference patch series
        run: |
          set -e
          git init -q ref
          git -C ref remote add origin "$REF_REPO"
          git -C ref fetch -q --depth 1 origin "$REF_REF"
          git -C ref checkout -q FETCH_HEAD
          ls ref/xnu/patches | head -5
          echo "reference patches: $(ls ref/xnu/patches | wc -l)"

      - name: Fetch the build script and stage the patches
        run: |
          set -e
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp ref/xnu/patches/*.patch dxb/patches/
          cp ref/xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          # the staging scripts are gated on SWEET; FUXI and PANDORA use the same staged sources
          sed -i '' 's/\[\[ "${MACHINE_CONFIG:-}" == SWEET \]\]/[[ "${MACHINE_CONFIG:-}" =~ ^(SWEET|FUXI|PANDORA)$ ]]/' dxb/patches/*.sh 2>/dev/null || true
          # libfirehose_kernel is built arm64e-only; this kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          echo "staged patches: $(ls dxb/patches/*.patch | wc -l)"

      - name: Deps
        run: |
          set -e
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Collect the kernel
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          for f in out/kernel.*; do
            [ -f "$f" ] && (cd out && shasum -a 256 "$(basename "$f")" >> SHA256SUMS)
          done || true
          cat out/SHA256SUMS 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pandora-kernel
          path: out/
          if-no-files-found: warn
          retention-days: 7

      - name: Build log tail on failure
        if: failure()
        run: |
          tail -200 dxb/build/xnu.obj/*/build.log 2>/dev/null || true
          find dxb -name '*.rej' -o -name '*.log' | head -20 || true
