name: build iOS HFSX root for pandora/lafa (linux)

# Builds the two things the pandora boot chain still needs on this side:
#
#   1. an HFSX root image (iOS 16.7.16, the version pandora's kernel targets), built the same
#      way bangprovn/ios-fuxi's mkiosroot.sh builds it: apfs-fuse reads the IPSW's APFS
#      volumes, mkfs.hfsplus -s makes a case-sensitive (HFSX) 16 GiB image, rsync copies the
#      root and the cryptexes in, and the dyld cache is hard-linked where dyld looks for it;
#   2. pinfile, the static Android arm64 helper that reserves a fixed-position file in f2fs
#      /data and writes an image into its blocks (the storage scheme pandora/ios-fuxi use).
#
# Both are published to a release so the phone can fetch them over its own (fast) link.
#
# Everything runs on a GitHub-hosted ubuntu runner: loop mounts and hfsplus live here, which
# is exactly what the Windows host cannot do.

on:
  workflow_dispatch:
    inputs:
      ios_version:
        description: iOS version of the iPhone X IPSW to build the root from
        default: "16.7.16"
      root_size:
        description: root image size passed to mkiosroot.sh
        default: "8G"

concurrency:
  group: ios-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: write          # publish the release with the split image + pinfile
    steps:
      - uses: actions/checkout@v4

      - name: free disk space (the root image needs ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: system packages (apfs-fuse is not in 22.04, so build it)
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            hfsprogs zstd rsync unzip curl python3 ca-certificates \
            cmake build-essential pkg-config libfuse3-dev zlib1g-dev libbz2-dev \
            libssl-dev libattr1-dev libicu-dev
          git clone --depth 1 https://github.com/sgan81/apfs-fuse.git
          cd apfs-fuse
          git submodule update --init --depth 1
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          sudo install -m755 build/apfs-fuse /usr/local/bin/apfs-fuse
          apfs-fuse --help 2>&1 | head -3

      - name: hfsplus kernel module (mount -t hfsplus needs it)
        run: |
          set +e
          sudo modprobe hfsplus 2>&1 || true
          if ! grep -q hfsplus /proc/filesystems; then
            echo "hfsplus not in /proc/filesystems; installing modules-extra"
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo depmod -a
            sudo modprobe hfsplus 2>&1 || true
          fi
          grep -q hfsplus /proc/filesystems && echo "hfsplus available" || echo "hfsplus STILL MISSING"
          cat /proc/filesystems | tr '\n' ' '

      - name: reference tools
        run: |
          set -e
          git clone --depth 1 https://github.com/bangprovn/ios-fuxi ref-fuxi
          git clone --depth 1 https://github.com/ShueiTsuki/data-a-live ref-pandora
          cp ref-fuxi/tools/mkiosroot.sh .
          cp ref-pandora/tools/pinfile/pinfile.c .
          chmod +x mkiosroot.sh
          ls -la mkiosroot.sh pinfile.c

      - name: download the iPhone X IPSW
        run: |
          set -e
          V="${{ inputs.ios_version }}"
          URL=$(curl -sf "https://api.ipsw.me/v4/device/iPhone10,3?type=ipsw" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); print([f for f in d['firmwares'] if f['version']=='$V'][0]['url'])")
          echo "IPSW: $URL"
          curl -fL --retry 3 --retry-delay 5 -o ipsw.zip "$URL"
          ls -la ipsw.zip
          echo "=== IPSW contents (dmg / Firmware) ==="
          unzip -l ipsw.zip | grep -iE 'dmg|Firmware/' | head -40 || true
          echo "=== total entries ==="
          unzip -l ipsw.zip | tail -3 || true

      - name: extract the APFS dmg volumes
        run: |
          set -e
          mkdir -p dmg
          unzip -j -o ipsw.zip '*.dmg' -d dmg || true
          ls -la dmg
          rm -f ipsw.zip
          df -h /
          echo "--- volume names (apfs-fuse) ---"
          for f in dmg/*.dmg; do
            echo "== $f"
            apfs-fuse --list-volumes "$f" 2>&1 | head -8 || true
          done

      - name: build the HFSX root
        env:
          ROOT_SIZE: ${{ inputs.root_size }}
        run: |
          set -e
          # Five dmgs at the top level.  Distinguish by content inside the "root" volume:
          #   SystemOS  = /System/Library/Caches/com.apple.dyld is a real directory (the cache)
          #   OS        = CoreServices/SystemVersion.plist but the dyld path is a symlink or absent
          #   AppOS     = neither, and it is one of the small ones
          ls -la dmg
          classify() {
            local mount="$1"
            if [ -d "$mount/root/System/Library/Caches/com.apple.dyld" ] && \
               [ ! -L "$mount/root/System/Library/Caches/com.apple.dyld" ]; then
              echo sysos; return
            fi
            if [ -e "$mount/root/System/Library/CoreServices/SystemVersion.plist" ]; then
              echo os; return
            fi
            if [ -d "$mount/root" ]; then echo appos; return; fi
            echo none
          }
          os_dmg=""; sys_dmg=""; app_dmg=""; mounted=()
          n=0
          for f in dmg/*.dmg; do
            n=$((n+1)); m="mnt$n"; mkdir -p "$m"
            echo "== $f ($(stat -c%s "$f") bytes)"
            if ! sudo apfs-fuse "$f" "$m" >/dev/null 2>&1; then echo "   mount failed"; continue; fi
            mounted+=("$f")
            kind=$(sudo bash -c "$(declare -f classify); classify '$m'")
            echo "   classified: $kind"
            case "$kind" in
              os)    [ -z "$os_dmg" ]  && os_dmg="$f" ;;
              sysos) [ -z "$sys_dmg" ] && sys_dmg="$f" ;;
              appos) [ -z "$app_dmg" ] && app_dmg="$f" ;;
            esac
          done
          # fall back to size order among the ones that mounted
          if [ -z "$os_dmg" ] || [ -z "$sys_dmg" ] || [ -z "$app_dmg" ]; then
            echo "falling back to size order"; ls -S "${mounted[@]}"
            mapfile -t by_size < <(ls -S "${mounted[@]}")
            [ -n "$os_dmg" ]  || os_dmg="${by_size[0]:-}"
            [ -n "$sys_dmg" ] || { [ "${by_size[1]:-}" != "$os_dmg" ] && sys_dmg="${by_size[1]:-}"; }
            [ -n "$app_dmg" ] || { [ "${by_size[2]:-}" != "$sys_dmg" ] && app_dmg="${by_size[2]:-}"; }
          fi
          echo "FINAL: OS=$os_dmg SYSTEMOS=$sys_dmg APPOS=$app_dmg"
          [ -n "$os_dmg" ] && [ -n "$sys_dmg" ] && [ -n "$app_dmg" ]
          sudo bash mkiosroot.sh "$os_dmg" "$sys_dmg" "$app_dmg" root.img "$ROOT_SIZE"
          ls -la root.img
          python3 -c "b=open('root.img','rb').read(2048); s=b[1024:1026]; print('volume signature:', s); assert s==b'HX', 'not case-sensitive HFSX'"

      - name: compress and split the root image
        run: |
          set -e
          zstd -3 -T0 -f root.img -o root.img.zst
          ls -la root.img.zst
          split -b 1900M -d root.img.zst root.img.zst.part.
          ls -la root.img.zst.part.*
          sha256sum root.img root.img.zst root.img.zst.part.* > SHA256SUMS
          cat SHA256SUMS

      - name: build pinfile (static Android arm64)
        run: |
          set -e
          curl -fL --retry 3 -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q ndk.zip
          NDK=android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin
          "$NDK/clang" --target=aarch64-linux-android31 -static -O2 -Wall -Wextra \
            -o pinfile pinfile.c
          file pinfile || true
          sha256sum pinfile

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-root-parts
          path: |
            SHA256SUMS
            pinfile
          if-no-files-found: warn
          retention-days: 7

      - name: publish the release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="ios-root-${{ inputs.ios_version }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" root.img.zst.part.* pinfile SHA256SUMS \
            --title "iOS root ${{ inputs.ios_version }} (HFSX 16 GiB) + pinfile" \
            --notes "Built by the ios-root workflow from the iPhone X IPSW: HFSX root image (split, zstd) and the static Android arm64 pinfile helper."
          gh release view "$TAG" --json assets -q '.assets[].name'
