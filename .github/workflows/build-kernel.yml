name: build lafa kernel

"on":
  push:
  workflow_dispatch:

jobs:
  kernel:
    name: XNU kernel for realme GT8 Pro (lafa, SM8850)
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: checkout (device package + this workflow)
        uses: actions/checkout@v4

      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm make git python3 perl flex bison m4 \
            autoconf automake libtool pkg-config libssl-dev zlib1g-dev libxml2-dev \
            libncurses-dev 7zip lz4 unzip curl xz-utils rsync file

      - name: theos + Linux toolchain + iPhoneOS16.5 SDK
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain"
          TC=https://github.com/L1ghtmann/llvm-project/releases
          curl -fsSL "$TC/download/test-210562a/iOSToolchain-x86_64.tar.xz" | tar -xJ -C "$HOME/theos/toolchain/" || \
            curl -fsSL "$TC/latest/download/iOSToolchain-x86_64.tar.xz" | tar -xJ -C "$HOME/theos/toolchain/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/ld"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos/sdks-git"
          git -C "$HOME/theos/sdks-git" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          ln -sfn "$HOME/theos/sdks-git/iPhoneOS16.5.sdk" "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: hakios source + lafa device package
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios
          cp -r lafa hakios/devices/lafa
          grep -q '^device lafa' hakios/devices/manifest.conf || \
            printf '\ndevice lafa\n\tpath        devices/lafa\n' >> hakios/devices/manifest.conf
          cd hakios
          python3 tools/hakios-device.py check lafa

      # Ubuntu 22.04 的 glibc 2.35 没有 strlcat/strlcpy（2.38 才加），XNU 的 SETUP 主机工具
      # replacecontents 要用；ci/patch-hostcompat.py 给 hostcompat.h 补两个实现（它被 -include 进所有主机工具）。
      - name: "patch tree (strlcpy/strlcat, clang auto-var-init)"
        run: python3 ci/patch-hostcompat.py hakios

      - name: configure
        run: |
          cd hakios
          make lafa_defconfig
          make config

      - name: kernel tree (xnu/apply.sh)
        run: |
          cd hakios
          [ -d xnu-src/xnu-8796.121.2 ] || xnu/apply.sh
          ls -d xnu-src/xnu-8796.121.2

      # 只读：把 MMU 早期启动用到的常量写进日志（docs/MILESTONE-2026-11-01.md 的调查清单）
      - name: "dump MMU constants (debug)"
        run: |
          cd hakios/xnu-src/xnu-8796.121.2
          echo "=== SCTLR_EL1_DEFAULT ==="
          grep -rn "SCTLR_EL1_DEFAULT" osfmk pexpert 2>/dev/null | head -5 || true
          echo "=== sysreg_restore ==="
          grep -rn "sysreg_restore" osfmk pexpert 2>/dev/null | head -20 || true
          echo "=== SR_RESTORE_* ==="
          grep -rn "SR_RESTORE_TCR_EL1\|SR_RESTORE_SCTLR\|SR_RESTORE_MAIR" osfmk/arm64/asm.h 2>/dev/null || true
          echo "=== ARM_TT / PGBYTES ==="
          grep -rn "ARM_TT_L2_SHIFT\|TTE_PGENTRIES\|ARM_PGBYTES\|ARM_PGSHIFT" pexpert/pexpert/arm64/*.h osfmk/arm64/*.h osfmk/arm/*.h 2>/dev/null | head -25 || true
          echo "=== PAGE_SHIFT ==="
          grep -rn "define PAGE_SHIFT\|define ARM_PGBYTES" osfmk pexpert 2>/dev/null | head -10 || true
          echo "=== arm64 dir ==="
          ls osfmk/arm64/ | head -40
          echo "=== __ARM_16K_PG__ (谁定义的) ==="
          grep -rn "__ARM_16K_PG__" --include="*.h" --include="*.s" --include="*.c" --include="Makefile*" . 2>/dev/null | head -25 || true
          echo "=== ARM_16K_PG 在配置里 ==="
          grep -rn "ARM_16K_PG" config/ bsd/conf/ pexpert/conf/ 2>/dev/null | head -20 || true
          echo "=== T0SZ_BOOT 分支 (proc_reg.h 925-975) ==="
          sed -n '925,975p' osfmk/arm64/proc_reg.h
          echo "=== BOOTSTRAP_TABLE_SIZE ==="
          grep -rn "BOOTSTRAP_TABLE_SIZE" osfmk pexpert 2>/dev/null | head -10 || true
          echo "=== bcm2837 配置里的相关选项 ==="
          grep -n "ARM_16K\|LARGE_VA\|ARM64_PAGE\|PAGE_SIZE" config/MASTER.arm64.bcm2837 2>/dev/null | head -20 || true

      - name: host tools (xnu-deps/setup.sh)
        run: |
          cd hakios
          set +e
          xnu-deps/setup.sh 2>&1 | tee /tmp/setup.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::group::exporthdrs.log (tail)"
            tail -120 xnu-deps/exporthdrs.log 2>/dev/null || echo "(no exporthdrs.log)"
            echo "::endgroup::"
            echo "::group::setup.log (tail)"
            tail -60 /tmp/setup.log
            echo "::endgroup::"
          fi
          exit $rc

      - name: patch kernel probes (framebuffer markers in start.s)
        run: python3 ci/patch-kernel-probes.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel probes 2 (MMU window)
        run: python3 ci/patch-kernel-probes2.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel brk (exception round-trip)
        run: python3 ci/patch-kernel-brk.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel keep early vbar
        run: python3 ci/patch-kernel-keepvbar.py hakios/xnu-src/xnu-8796.121.2

      - name: build kernel
        run: |
          cd hakios
          set +e
          make kernel JOBS=4 2>&1 | tee /tmp/kernel.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::group::kernel log (errors)"
            grep -n -m 60 -E 'error:|Error [0-9]|undefined reference|fatal error|No rule' /tmp/kernel.log || tail -80 /tmp/kernel.log
            echo "::endgroup::"
          fi
          exit $rc

      - name: patch loader for lafa (platform + GOP selection)
        run: python3 ci/patch-loader-lafa.py hakios

      - name: build loader (placeholder identity, no Apple data)
        continue-on-error: true
        run: |
          cd hakios
          make loader-open || echo "loader build failed (lld: fixup value out of range); prebuilt/loader.efi is used instead"

      - name: summary
        run: |
          cd hakios
          ls -la hakios-kernel xnuloader/loader.efi || true

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafa-kernel
          path: |
            hakios/hakios-kernel
            hakios/xnuloader/loader.efi
            hakios/prebuilt/loader.efi
          if-no-files-found: warn
