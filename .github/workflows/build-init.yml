name: build lafa init

# init.c ends up in root.apfs, the 4 MiB image that travels in the boot payload next to the kernel.
# build.sh skips compiling when it cannot find ld64:
#
#     [ -z "$PREBUILT" ] && ! command -v ld64 && PREBUILT=1
#
# and that is why an edit to init.c silently does nothing on the Windows side: there is no Mach-O
# linker there, so the build copies the old prebuilt binaries. The CI images have no "ld64" either,
# but the theos toolchain's "ld" *is* ld64, so a symlink is enough to make build.sh compile.
#
# This job builds two things and uploads them:
#   - obj/init          the one binary this change is about, ready to drop into userland/root/sbin/
#   - mini.o, start.o   its two freestanding objects, in case those are stale on the other side
# Repacking root.apfs is left to the machine that has the full userland/root tree.

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: checkout (device package + this workflow)
        uses: actions/checkout@v4

      - name: theos + Linux toolchain + iPhoneOS16.5 SDK
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain"
          TC=https://github.com/L1ghtmann/llvm-project/releases
          curl -fsSL "$TC/download/test-210562a/iOSToolchain-x86_64.tar.xz" | tar -xJ -C "$HOME/theos/toolchain/" || \
            curl -fsSL "$TC/latest/download/iOSToolchain-x86_64.tar.xz" | tar -xJ -C "$HOME/theos/toolchain/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/ld"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos/sdks-git"
          git -C "$HOME/theos/sdks-git" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          ln -sfn "$HOME/theos/sdks-git/iPhoneOS16.5.sdk" "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: hakios source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/oosexgang/hakios-xnu-kernel.git hakios
          ls hakios/userland/libmini

      - name: our init.c changes
        run: |
          python3 ci/patch-init-cache-probe.py hakios
          python3 ci/patch-init-ramfs.py hakios/userland
          python3 ci/patch-init-datavol.py hakios/userland
          python3 ci/patch-init-ufsreport.py hakios/userland
          python3 ci/patch-init-rawtest.py hakios/userland
          python3 ci/patch-init-stop.py hakios/userland
          python3 ci/patch-init-flashroot.py hakios/userland
          python3 ci/patch-init-preboom.py hakios/userland
          python3 ci/patch-init-redwoodmount.py hakios/userland
          python3 ci/patch-init-rcdiag.py hakios/userland
          python3 ci/patch-init-volprobe.py hakios/userland
          python3 ci/patch-init-final.py hakios/userland
          python3 ci/patch-init-cachefix.py hakios/userland
          python3 ci/patch-init-jobbind.py hakios/userland
          python3 ci/patch-init-exec-launchd.py hakios/userland

      - name: toolchain shims (ld64 -> theos ld, xnu-clang -> theos clang -target arm64)
        run: |
          set -euo pipefail
          TC="$HOME/theos/toolchain/linux/iphone/bin"
          ls "$TC" | tr '\n' ' '; echo
          sudo ln -sf "$TC/ld" /usr/local/bin/ld64
          # -arch is not enough here: a plain clang defaults to the host triple and errors out in
          # libmini/start.S with "unknown use of instruction mnemonic". The iOS triple is what
          # makes it assemble arm64.
          sudo tee /usr/local/bin/xnu-clang >/dev/null <<'EOF'
          #!/bin/sh
          exec "$HOME/theos/toolchain/linux/iphone/bin/clang" -target arm64-apple-ios16.0 "$@"
          EOF
          sudo chmod +x /usr/local/bin/xnu-clang
          ld64 -v 2>&1 | head -2 || true
          echo 'int main(void){return 0;}' > /tmp/t.c
          xnu-clang -c /tmp/t.c -o /tmp/t.o && file /tmp/t.o

      - name: compile init (freestanding, libmini)
        run: |
          set -euo pipefail
          export PATH="$HOME/theos/toolchain/linux/iphone/bin:$PATH"
          cd hakios/userland
          mkdir -p obj
          CC="xnu-clang -arch arm64 -Os -static -nostdlib -ffreestanding -fno-stack-protector -fno-builtin -Wall -Wextra"
          LD="-Wl,-e,_start -Wl,-pagezero_size,0x100000000"
          $CC -Ilibmini -c libmini/mini.c -o mini.o
          $CC -c libmini/start.S -o start.o
          $CC -Ilibmini $LD -o obj/init src/init.c mini.o start.o
          ls -l obj/init mini.o start.o
          echo "--- does it carry the new prints? ---"
          grep -ac 'cache probe' obj/init || echo 0
          grep -ac 'the shared cache is where dyld looks for it' obj/init || echo 0
          grep -ac 'ramfs on /private/var' obj/init || echo 0
          grep -ac 'data volume on /System/Volumes/Data' obj/init || echo 0
          grep -ac 'HFS+ (read-write, kept between boots)' obj/init || echo 0
          grep -ac 'HAKIOSREPORT' obj/init || echo 0
          grep -ac 'rd = %s, boot-mode' obj/init || echo 0
          grep -ac 'usr payload' obj/init || echo 0

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: lafa-init
          path: |
            hakios/userland/obj/init
            hakios/userland/mini.o
            hakios/userland/start.o
          if-no-files-found: error
