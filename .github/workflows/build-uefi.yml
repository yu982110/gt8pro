name: build uefi (aston, SM8850 reference)

"on":
  workflow_dispatch:

jobs:
  uefi-aston:
    name: Mu-Silicium astonPkg (OnePlus 15, same SM8850)
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: clone Mu-Silicium (recursive, ~5 GB)
        run: git clone --recursive --depth 1 https://github.com/Project-Silicium/Mu-Silicium.git

      - name: python (tomllib needs 3.11+)
        run: python3 --version

      - name: dependencies
        working-directory: Mu-Silicium
        run: |
          sudo ./setup_env.sh -p apt || sudo apt-get install -y python3 python3-pip python3-venv nasm iasl uuid-dev
          python3 -m pip install --user -r pip-requirements.txt

      - name: build aston
        working-directory: Mu-Silicium
        run: python3 build_uefi.py -d aston

      - name: assemble boot.img (BootShim + FV + aston dtb)
        run: python3 ci/mkboot.py Mu-Silicium aston 0xA7100000 0x300000 boot-aston.img

      # 把拼图单独拿出来：本地要试“不压缩的 PE + FV”等不同打包方式，不必每次都等 CI。
      - name: collect parts
        run: |
          mkdir -p parts
          cp Mu-Silicium/BootShim/BootShim.bin      parts/BootShim.bin
          cp Mu-Silicium/BootShim/BootShim.elf      parts/BootShim.elf
          cp Mu-Silicium/Resources/DTBs/aston.dtb   parts/aston.dtb
          cp Mu-Silicium/Resources/ramdisk          parts/ramdisk
          cp Mu-Silicium/Resources/Scripts/mkbootimg.py parts/mkbootimg.py
          cp Mu-Silicium/Build/astonPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd parts/
          ls -la parts/

      - name: show results
        run: |
          find Mu-Silicium/Build -maxdepth 5 -type f \( -name '*.fd' -o -name '*.img' \) -printf '%p  %s bytes\n' | head -20
          ls -la boot-aston.img

      - name: upload UEFI + boot.img + parts
        uses: actions/upload-artifact@v4
        with:
          name: uefi-aston
          path: |
            Mu-Silicium/Build/**/*.fd
            boot-aston.img
            parts/*
          if-no-files-found: warn
