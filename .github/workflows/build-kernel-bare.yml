name: build lafa kernel BARE (framebuffer patch only)

"on":
  workflow_dispatch:

jobs:
  kernel:
    name: bare XNU kernel for lafa (only the framebuffer patch)
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: checkout (device package + this workflow)
        uses: actions/checkout@v4

      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm make git python3 perl flex bison m4 ccache \
            autoconf automake libtool pkg-config libssl-dev zlib1g-dev libxml2-dev \
            libncurses-dev 7zip lz4 unzip curl xz-utils rsync file

      - name: theos + Linux toolchain + iPhoneOS16.5 SDK
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/toolchain"
          TC=https://github.com/L1ghtmann/llvm-project/releases
          curl -fsSL "$TC/download/test-210562a/iOSToolchain-x86_64.tar.xz" | tar -xJ -C "$HOME/theos/toolchain/" || \
            curl -fsSL "$TC/latest/download/iOSToolchain-x86_64.tar.xz" | tar -xJ -C "$HOME/theos/toolchain/"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/ld"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$HOME/theos/sdks-git"
          git -C "$HOME/theos/sdks-git" sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$HOME/theos/sdks"
          ln -sfn "$HOME/theos/sdks-git/iPhoneOS16.5.sdk" "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: hakios source + lafa device package
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/oosexgang/hakios-xnu-kernel.git hakios
          cp -r lafa hakios/devices/lafa
          grep -q '^device lafa' hakios/devices/manifest.conf || \
            printf '\ndevice lafa\n\tpath        devices/lafa\n' >> hakios/devices/manifest.conf
          cd hakios
          python3 tools/hakios-device.py check lafa

      # Ubuntu 22.04 的 glibc 2.35 没有 strlcat/strlcpy（2.38 才加），XNU 的 SETUP 主机工具
      # replacecontents 要用；ci/patch-hostcompat.py 给 hostcompat.h 补两个实现（它被 -include 进所有主机工具）。
      - name: "patch tree (strlcpy/strlcat, clang auto-var-init)"
        run: python3 ci/patch-hostcompat.py hakios

      - name: configure
        run: |
          cd hakios
          make lafa_defconfig
          make config

      # Reuse the toolchain and the kernel object tree between runs.  The object tree is
      # restored with a fresh cache key each run and the patched sources get new mtimes, so
      # make recompiles exactly what a patch changed.  (An earlier attempt failed because a
      # BUILD was restored from a step that had not even reached the 4K-pages config.)
      - name: cache theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-linux-${{ hashFiles('lafa/configs/lafa.config') }}
          restore-keys: theos-linux-


      - name: ccache (the object tree cannot be cached; this can)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.run_id }}
          restore-keys: |
            ccache-
      - name: point clang at ccache
        run: |
          set -e
          sudo mkdir -p /usr/local/bin
          for c in clang clang++; do
            real=$(command -v $c)
            printf '#!/bin/sh\nexec ccache %s "$@"\n' "$real" | sudo tee /usr/local/bin/$c >/dev/null
            sudo chmod 755 /usr/local/bin/$c
            echo "$c -> ccache $real"
          done
          echo /usr/local/bin >> "$GITHUB_PATH"
          ccache --version | head -1
          ccache -M 2G


      - name: kernel tree (xnu/apply.sh)
        run: |
          cd hakios
          [ -d xnu-src/xnu-8796.121.2 ] || xnu/apply.sh
          ls -d xnu-src/xnu-8796.121.2
      - name: host tools (xnu-deps/setup.sh)
        run: |
          cd hakios
          set +e
          xnu-deps/setup.sh 2>&1 | tee /tmp/setup.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::group::exporthdrs.log (tail)"
            tail -120 xnu-deps/exporthdrs.log 2>/dev/null || echo "(no exporthdrs.log)"
            echo "::endgroup::"
            echo "::group::setup.log (tail)"
            tail -60 /tmp/setup.log
            echo "::endgroup::"
          fi
          exit $rc

      - name: patch kernel 4K pages
        run: python3 ci/patch-kernel-4k-pages.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel pthread layout (match libpthread-514, 56 bytes)
        continue-on-error: true
        run: python3 ci/patch-kernel-pthread-layout.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel SMP (all eight cores, Aff2 masks)
        continue-on-error: true
        run: python3 ci/patch-kernel-smp-aff2.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel SweetCPU (IOCPU + PSCI CPU_ON, from the reference)
        continue-on-error: true
        run: python3 ci/patch-kernel-sweetcpu.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel CPU entry (PSCI secondary entry in start.s)
        continue-on-error: true
        run: python3 ci/patch-kernel-cpu-entry.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel SMP caches (clean what the secondary stub reads)
        continue-on-error: true
        run: python3 ci/patch-kernel-smp-caches.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel topology probe (why ml_processor_register fails)
        continue-on-error: true
        run: python3 ci/patch-kernel-smp-topo.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel native cs hash
        run: python3 ci/patch-kernel-native-cs-hash.py hakios/xnu-src/xnu-8796.121.2

      - name: apply unixnu 4K patches
        run: |
          cd hakios/xnu-src/xnu-8796.121.2
          # GitHub runs steps with bash -e, and patch(1) exits non-zero when a hunk needed fuzz or
          # an offset -- which is every hunk here. The patches still apply; the early exit was the
          # whole failure.
          set +e
          # git apply is strict about the index and about context; these patches were made against
          # a differently patched tree, so use patch(1) with fuzz, and keep going if one hunk is
          # already there (--forward) or reversed (--reverse-safe is not a thing; -N does that).
          for p in $GITHUB_WORKSPACE/ci/0028-sweet-ufs-root-device.patch \
                   $GITHUB_WORKSPACE/ci/0030-sweet-ufs-writes.patch \
                   $GITHUB_WORKSPACE/ci/0088-fuxi-extent-root.patch \
                   $GITHUB_WORKSPACE/ci/0103-unixnu-native-4k-bootstrap-capacity.patch \
                   $GITHUB_WORKSPACE/ci/0104-unixnu-native-4k-user-abi.patch \
                   $GITHUB_WORKSPACE/ci/0105-unixnu-native-4k-signature-hash-cache.patch \
                   $GITHUB_WORKSPACE/ci/0106-pandora-4k-build-fixes.patch \
                   $GITHUB_WORKSPACE/ci/0107-pandora-ios-address-layout.patch \
                   $GITHUB_WORKSPACE/ci/0120-pandora-ufs-driver-init.patch \
                   $GITHUB_WORKSPACE/ci/0122-pandora-extent-table-16k-binary-search.patch \
                   $GITHUB_WORKSPACE/ci/0127-pandora-cs-native4k-1mib-reads.patch \
                   $GITHUB_WORKSPACE/ci/0036-sweet-amfi-cs-signed.patch \
                   $GITHUB_WORKSPACE/ci/0151-pandora-original-amfi-early-init.patch \
                   $GITHUB_WORKSPACE/ci/0152-pandora-sweet-amfi-prelink-check.patch ; do
            echo "== $(basename $p)"
            patch -p1 -N --fuzz=3 --no-backup-if-mismatch < "$p"
          done
          echo "== patch leftovers"
          find . -name '*.rej' -o -name '*.orig' | head -20
      - name: upload sweet_ufs source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-ufs-source
          path: |
            hakios/xnu-src/xnu-8796.121.2/bsd/dev/sweet_ufs.c
            hakios/xnu-src/xnu-8796.121.2/bsd/dev/sweet_ufs.c.rej
          if-no-files-found: warn

      - name: show patch rejects
        if: always()
        run: |
          set +e
          find . -name '*.rej' | head -20
          for f in $(find . -name '*.rej' | head -6); do echo "=== $f"; cat "$f"; done | head -260
          echo '=== end of rejects ==='

      - name: patch kernel native4k early
        run: python3 ci/patch-kernel-native4k-early.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel shared cache config
        run: python3 ci/patch-kernel-sharedcache-config.py hakios

      - name: patch kernel framebuffer probe config
        run: python3 ci/patch-kernel-fbprobe-config.py hakios

      - name: patch kernel cs skipbig
        run: python3 ci/patch-kernel-cs-skipbig.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel proctrace
        run: python3 ci/patch-kernel-proctrace.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel ufsrw-all
        run: python3 ci/patch-kernel-ufsrw-all.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel ufsrw-probe
        run: python3 ci/patch-kernel-ufsrw-probe.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel ufsrw-bounds
        run: python3 ci/patch-kernel-ufsrw-bounds.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel darwin-min
        run: python3 ci/patch-kernel-darwin-min.py hakios

      - name: patch kernel ufsrw-force
        run: python3 ci/patch-kernel-ufsrw-force.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel cs nocache
        run: python3 ci/patch-kernel-cs-nocache.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel initwait
        run: python3 ci/patch-kernel-initwait.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel framebuffer (the only patch in this build)
        run: python3 ci/patch-kernel-fb.py hakios/xnu-src/xnu-8796.121.2


      - name: patch kernel GIC redistributor stride
        run: python3 ci/patch-kernel-gicr.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel live-log probes
        run: python3 ci/patch-kernel-livelog-probe.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel skip debug-only inits
        run: python3 ci/patch-kernel-skip-debug-init.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel keystore (AppleKeyStore registration)
        continue-on-error: true
        run: python3 ci/patch-kernel-keystore.py hakios/xnu-src/xnu-8796.121.2 2>&1 | tail -25

      - name: patch kernel exit probes (which step of a process's exit never returns)
        run: python3 ci/patch-kernel-exitprobe.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel sysprobe (name the syscall a process stops in, logd included)
        continue-on-error: true
        run: python3 ci/patch-kernel-sysprobe.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel proc_info probe (where the last syscall hangs)
        continue-on-error: true
        run: python3 ci/patch-kernel-procinfo-probe.py hakios/xnu-src/xnu-8796.121.2

      # 2026-11-22 10:09 (gpu60): the last screen line before the reset was
      #   HAKIOS-PROCI entry pid 53 call 2 flavor 13     (and no "done" line)
      # right after pid 53's proc_exit / task_terminate_internal, while flavor 15/8/18 on the
      # same pid had just returned 0.  Refuse PIDINFO for a zombie so the flavour handler never
      # dereferences the dead process; launchd gets ESRCH, which is what a reaped child is.
      - name: patch kernel proc_info zombie guard (PIDINFO about a dead child stops the machine)
        continue-on-error: true
        run: python3 ci/patch-kernel-procinfo-guard.py hakios/xnu-src/xnu-8796.121.2

      # RE-ENABLED 2026-11-22 14:30.  The loader's flight recorder (gpu84) captured the
      # kernel's last megabyte: logd is exec'd and exits by SIGTRAP within ~2 ms, 41 times in
      # a row, and the kernel's log stops right there (~80 s of kernel time) before the
      # platform hard-resets.  The 03:40 experiment removed this guard to see whether the old
      # freeze came back without it -- it did.  Put the guard back while the userspace crash
      # itself is investigated; take it out when logd's SIGTRAP is fixed.
      - name: patch kernel nologd (refuse logd so its crash chain cannot freeze the boot)
        continue-on-error: true
        run: python3 ci/patch-kernel-nologd.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel workq probe (which workq_kernreturn operation the freeze is in)
        continue-on-error: true
        run: python3 ci/patch-kernel-workq-probe.py hakios/xnu-src/xnu-8796.121.2

      # 2026-11-22 15:0x: with logd blocked the system reaches idle and then hard-resets.
      # Make machine_idle() a plain WFI so one boot says whether the deep-idle path is it.
      # 2026-11-22 16:2x: the loader alone lives 663 s, so the ~58 s reset is guest-side.
      # Log every reboot(2) caller and make it a no-op: the log names the killer if it is one.
      # 2026-11-22 17:3x: the ~57 s reset comes in the same second the machine stops, so log
      # the panic message into the loader log at the top of panic() itself.
      # 2026-11-25 17:0x: runtime switch to stop before launchd (hakios_noinit=1).
      - name: patch kernel noinit (stop before launchd, on a boot arg)
        continue-on-error: true
        run: python3 ci/patch-kernel-noinit.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel panic log (panic message into the loader log)
        continue-on-error: true
        run: python3 ci/patch-kernel-panic-log.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel reboot trace (name the reboot(2) caller, do not reset)
        continue-on-error: true
        run: python3 ci/patch-kernel-reboot-trace.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel idle (machine_idle -> plain wfi)
        continue-on-error: true
        run: python3 ci/patch-kernel-idle-wfi.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel ticker (a heartbeat that does not use the console)
        run: python3 ci/patch-kernel-ticker.py hakios/xnu-src/xnu-8796.121.2

      # 2026-11-22 10:42: DISABLED.  The IMEM heartbeat idea is dead: the loader's own probe that
      # wrote 8 IMEM offsets killed the VM before it came up (loader boot log 0 bytes), so IMEM is
      # not guest scratch on this phone.  Kept for the record, not run.
      # - name: patch kernel IMEM heartbeat (a tick mark the next boot can read)
      #   continue-on-error: true
      #   run: python3 ci/patch-kernel-imem-mark.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel noserial (kprintf off the UART, which has nothing reading it)
        run: python3 ci/patch-kernel-noserial.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel novideocon (kprintf keeps out of the video console's scroll)
        run: python3 ci/patch-kernel-novideocon.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel km noout (user space console writes stop painting the panel)
        run: python3 ci/patch-kernel-kmnoout.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel vcnoop (the video console draws nothing, so console writes return)
        run: python3 ci/patch-kernel-vcnoop.py hakios/xnu-src/xnu-8796.121.2

      # - name: patch kernel sysprobe (name the syscall a process is inside when it stops)   [disabled for the probe-vs-kernel experiment]
        # (sysprobe step disabled)
#
      - name: patch kernel exec probe (which posix_spawn EPERM site)
        continue-on-error: true
        run: python3 ci/patch-kernel-execprobe.py hakios/xnu-src/xnu-8796.121.2

      - name: dump the spawnattr DRIVER source (SPAWNDRIVER-DUMP)
        run: |
          echo '=== every POSIX_SPAWN_PROC_TYPE_DRIVER site ==='
          grep -n -B3 -A8 'POSIX_SPAWN_PROC_TYPE_DRIVER' hakios/xnu-src/xnu-8796.121.2/bsd/kern/kern_exec.c || true
          echo '=== the entitlement check lines ==='
          grep -n 'POSIX_SPAWN_ENTITLEMENT_DRIVER' hakios/xnu-src/xnu-8796.121.2/bsd/kern/kern_exec.c || true
          echo '=== what the probe site looks like now ==='
          grep -n -A12 'HAKIOS-LAFA-SPAWNDRIVER' hakios/xnu-src/xnu-8796.121.2/bsd/kern/kern_exec.c || true
          echo '=== nologd patch (expected ABSENT on this build) ==='
          grep -n 'HAKIOS-LAFA-NOLOGD' hakios/xnu-src/xnu-8796.121.2/bsd/kern/kern_exec.c \
            && echo 'NOLOGD: STILL PRESENT -- the logd test is invalid' \
            || echo 'NOLOGD: absent (logd is allowed to spawn)'
      - name: patch kernel spawn driver check (the condition, not the return form)
        continue-on-error: true
        run: python3 ci/patch-kernel-spawndriver.py hakios/xnu-src/xnu-8796.121.2
      - name: patch kernel spawn policy (allow DRIVER spawn type)
        continue-on-error: true
        run: python3 ci/patch-kernel-spawnpolicy.py hakios/xnu-src/xnu-8796.121.2

      # 2026-11-25 21:0x: name the branch that still refuses launchd's spawns.
      - name: patch kernel spawn return sites (number the EPERM branches)
        continue-on-error: true
        run: python3 ci/patch-kernel-spawn-ret.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel ret probe (errno of xpcproxy's failed syscalls)
        continue-on-error: true
        run: python3 ci/patch-kernel-retprobe.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel priv grant (root gets every privilege)
        continue-on-error: true
        run: python3 ci/patch-kernel-privgrant.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel spawn site audit (number every failure exit in posix_spawn)
        continue-on-error: true
        run: python3 ci/patch-kernel-posixspawn-audit.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel file actions (name + ignore the inherit guard)
        continue-on-error: true
        run: python3 ci/patch-kernel-fileactions.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel open ok (a failed PSFA_OPEN is not fatal)
        continue-on-error: true
        run: python3 ci/patch-kernel-openok.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel open result (did backboardd's opens succeed)
        continue-on-error: true
        run: python3 ci/patch-kernel-openres.py hakios/xnu-src/xnu-8796.121.2

      # - name: patch kernel sysprobe2 (bracket MACF, audit and the handler)   [disabled for the probe-vs-kernel experiment]
        # (sysprobe step disabled)
#
      - name: remove the GPU sources from the build before the display patch
        run: |
          root=hakios/xnu-src/xnu-8796.121.2
          sed -i '/hakios.gpu.cpp\|hakios.adreno\|hakios_gpu/d' "$root/iokit/conf/files" 2>/dev/null || true
          sed -i '/hakios_adreno/s/^/# /' "$root/config/MASTER.hakios" 2>/dev/null || true
          echo 'GPU sources removed from the file list'

      - name: patch kernel display (Sweet IOSurface + IOMobileFramebuffer)
        continue-on-error: true
        run: python3 ci/patch-kernel-display.py hakios/xnu-src/xnu-8796.121.2 2>&1 | tail -25

      - name: patch kernel HID event services (SweetHID + IOHIDEvent, from the reference port)
        continue-on-error: true
        run: |
          cd hakios/xnu-src/xnu-8796.121.2
          patch -p1 --batch --forward < "$GITHUB_WORKSPACE/ci/0058-sweet-hid-event-services.patch"

      - name: patch kernel HID config (the two integration hunks the HID patch cannot apply)
        continue-on-error: true
        run: python3 ci/patch-kernel-hid-config.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel DPU scanout
        continue-on-error: true
        run: python3 ci/patch-kernel-dpu.py hakios/xnu-src/xnu-8796.121.2 2>&1 | tail -25

      - name: patch kernel display start (the config table is not probed here, so start the services by hand)
        continue-on-error: true
        run: python3 ci/patch-kernel-display-start.py hakios/xnu-src/xnu-8796.121.2 2>&1 | tail -10

      # 2026-11-25 19:5x: the frame the host is waiting for -- the kernel paints the framebuffer
      # from its own display service (SweetFramebuffer/AppleCLCD).
      - name: patch kernel framebuffer fill (the kernel paints the panel)
        continue-on-error: true
        run: python3 ci/patch-kernel-fb-fill-kernel.py hakios/xnu-src/xnu-8796.121.2

      # 2026-11-22 10:52: DISABLED after one bad boot.  Taking AppleCLCD::swap() out also took the
      # console pause inside it out, and that pause is protective (this port's kernel console would
      # draw through the physical address 0xFC800000 -- the comment in swap() says so).  The kernel
      # then crashed within seconds of the hand-off, so nothing was measured.
      # - name: patch kernel display no-swap (isolate the first-present path)
      #   continue-on-error: true
      #   run: python3 ci/patch-kernel-display-noswap.py hakios/xnu-src/xnu-8796.121.2 2>&1 | tail -5
      - name: patch kernel HID start (IOResources provider, not the PE)
        continue-on-error: true
        run: python3 ci/patch-kernel-hid-start.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel display probe (who opens the framebuffer, who presents a frame)
        continue-on-error: true
        run: python3 ci/patch-kernel-display-probe.py hakios/xnu-src/xnu-8796.121.2 2>&1 | tail -10
      - name: dump SweetFramebuffer for the logical-size fix (reference)
        continue-on-error: true
        run: |
          F=hakios/xnu-src/xnu-8796.121.2/iokit/Kernel/arm/SweetFramebuffer.cpp
          echo "=== file: $F ==="
          grep -n -E 'fLogical|fWidth|fHeight|SWEET_FB_LOGICAL|sweetfb_native|panel %u|dot_pitch|DOT_PITCH' "$F" | head -60
          echo "=== AppleCLCD::start head ==="
          sed -n '/AppleCLCD::start/,/registerService/p' "$F" | head -50

      - name: patch kernel MiniIOSurface weak (the display build drops MiniIOSurface.cpp)
        run: python3 ci/patch-kernel-miniiosurface-weak.py hakios/xnu-src/xnu-8796.121.2

      # the object tree is cached now: patched sources get fresh mtimes, so make
      # rebuilds exactly the files the patches touched

      - name: patch kernel Adreno 840 level 1 probe (read only)
        run: python3 ci/patch-kernel-pandora-gpu-probe.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel Adreno 840 user client (NativeAdreno ABI v1, what Turnip opens)
        run: python3 ci/patch-kernel-pandora-iokit.py hakios/xnu-src/xnu-8796.121.2

      # 2026-11-25 17:3x: the by-hand display/HID/GPU starts run unconditionally; gate them so a
      # boot can answer whether the kernel resets even with no such service running.
      # 2026-11-25 17:4x: earlier stop levels (hakios_stop=1/3) to bisect the kernel init.
      - name: patch kernel stop levels (spin before PE_init_iokit / EARLY_BOOT)
        continue-on-error: true
        run: python3 ci/patch-kernel-stop-level.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel service switch (hakios_services=0 skips display/HID/GPU starts)
        continue-on-error: true
        run: python3 ci/patch-kernel-svc-off.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel print the Mach-O magic exec rejected
        run: python3 ci/patch-kernel-execmagic-probe.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel print which check rejects the Mach-O
        run: python3 ci/patch-kernel-badmacho-probe.py hakios/xnu-src/xnu-8796.121.2

      - name: patch kernel HFS RENAME_SWAP falls back to exchangedata
        run: python3 ci/patch-kernel-hfs-rename-swap.py hakios/xnu-src/xnu-8796.121.2

      - name: build kernel
        run: |
          cd hakios
          set +e
          make kernel JOBS=4 2>&1 | tee /tmp/kernel.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "::group::kernel log (errors)"
            grep -n -m 60 -E 'error:|Error [0-9]|undefined reference|fatal error|No rule' /tmp/kernel.log || tail -80 /tmp/kernel.log
            echo "::endgroup::"
          fi
          exit $rc


      - name: symbolize host data (nm of the unstripped kernel, for panics)
        if: always()
        run: |
          K=hakios/xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if [ -f "$K" ]; then
            (command -v llvm-nm >/dev/null && llvm-nm -n "$K" || nm -n "$K") > /tmp/lafa-nm.txt 2>/dev/null || true
            wc -l /tmp/lafa-nm.txt
            grep -m3 -E ' sweet_hid_start| _panic$' /tmp/lafa-nm.txt || true
          fi
      - name: upload kernel symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafa-kernel-symbols
          path: /tmp/lafa-nm.txt
          if-no-files-found: warn

      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafa-kernel-bare
          path: hakios/hakios-kernel
          if-no-files-found: warn
